<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Mini</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#" data-nav="home">Instagram</a>

    <div class="search-wrap">
      <input id="search" class="search" type="text" placeholder="Tìm kiếm người dùng" autocomplete="off">
      <div id="searchResults" class="search-results hidden"></div>
    </div>

    <nav class="nav-icons">
      <button class="icon-btn" data-nav="home" title="Trang chủ">
        <svg viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V21h-6v-6H9v6H3z"/></svg>
      </button>
      <button class="icon-btn" data-nav="explore" title="Khám phá">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 5-5 2.2 2.2-5z"/></svg>
      </button>
      <button class="icon-btn" id="btnNewPost" title="Tạo bài viết">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
      </button>
      <button class="icon-btn" data-nav="saved" title="Đã lưu">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="Đổi giao diện">
        <svg viewBox="0 0 24 24"><path d="M20 13a8 8 0 1 1-9-9 6.5 6.5 0 0 0 9 9z"/></svg>
      </button>
      <button class="btn primary hidden" id="btnLoginTop" data-auth-open>Đăng nhập</button>
      <button class="icon-btn avatar-btn" data-nav="profile" title="Trang cá nhân">
        <img id="navAvatar" alt="Tôi">
      </button>
    </nav>
  </div>
</header>

<main id="app" class="container"></main>

<!-- ============ BOTTOM NAV (mobile) ============ -->
<nav class="bottombar">
  <button class="icon-btn" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V21h-6v-6H9v6H3z"/></svg></button>
  <button class="icon-btn" data-nav="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 5-5 2.2 2.2-5z"/></svg></button>
  <button class="icon-btn" data-nav="new"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button class="icon-btn" data-nav="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
  <button class="icon-btn avatar-btn" data-nav="profile"><img id="navAvatar2" alt="Tôi"></button>
</nav>

<!-- ============ MODAL: đăng nhập / đăng ký ============ -->
<div id="modalAuth" class="modal hidden">
  <div class="modal-card" style="max-width:400px">
    <div class="modal-head"><span id="authTitle">Đăng nhập</span>
      <button class="close" data-close>&times;</button></div>
    <form id="authForm" class="modal-body">
      <div class="logo" style="text-align:center;font-size:34px;margin-bottom:4px">Instagram</div>
      <input class="input" type="text" id="authUsername" placeholder="Tên người dùng" autocomplete="username" maxlength="30">
      <input class="input" type="email" id="authEmail" placeholder="Email" autocomplete="email" required>
      <input class="input" type="password" id="authPassword" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password" required>
      <div id="authError" class="auth-error"></div>
      <button class="btn primary" id="authSubmit" type="submit" style="width:100%">Đăng nhập</button>
      <div id="authSwitch" class="auth-switch"></div>
    </form>
  </div>
</div>

<!-- ============ MODAL: tạo bài viết ============ -->
<div id="modalNew" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <span>Tạo bài viết mới</span>
      <button class="close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <label id="dropzone" class="dropzone" for="fileInput">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-2 4 3"/></svg>
        <span>Kéo thả ảnh vào đây hoặc bấm để chọn</span>
        <small>tối đa 5 MB · hoặc dán một link ảnh bên dưới</small>
        <img id="preview" class="preview hidden" alt="">
      </label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <input type="url" id="imgUrl" class="input" placeholder="https://link-anh.jpg">
      <textarea id="caption" class="input" rows="3" placeholder="Viết chú thích..." maxlength="2200"></textarea>
      <input type="text" id="location" class="input" placeholder="Thêm vị trí (tuỳ chọn)" maxlength="100">
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>Huỷ</button>
      <button class="btn primary" id="btnShare">Chia sẻ</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: xem bài viết ============ -->
<div id="modalPost" class="modal hidden">
  <div class="modal-card post-card">
    <button class="close floating" data-close>&times;</button>
    <div id="postDetail" class="post-detail"></div>
  </div>
</div>

<!-- ============ MODAL: story ============ -->
<div id="modalStory" class="modal story-modal hidden">
  <button class="close floating" data-close>&times;</button>
  <div class="story-viewer">
    <div class="story-bar"><i id="storyProgress"></i></div>
    <div class="story-head"><img id="storyAvatar" alt=""><b id="storyName"></b><span id="storyTime"></span></div>
    <img id="storyImg" class="story-img" alt="">
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="fallback.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
